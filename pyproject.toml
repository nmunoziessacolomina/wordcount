[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wordcount"
version = "0.1.0"
description = "A CLI word count tool inspired by Unix wc"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "typer>=0.9.0",
]

[project.scripts]
wordcount = "wordcount.__main__:app"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "typer[all]>=0.9.0",  # Includes testing extras
]

[tool.setuptools.packages.find]
where = ["src"]